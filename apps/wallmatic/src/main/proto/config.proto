syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.axondragonscale.wallmatic.proto";

message Config {
  int64 updateInterval = 1;
  int64 lastUpdated = 2;
  bool mirrorHomeForLock = 3;
  ScreenConfig home = 4;
  ScreenConfig lock = 5;
  Failure failure = 6;
}

message ScreenConfig {
  int32 albumId = 1;
  int32 currentWallpaperId = 2;
}

message Failure {
  Screen target = 1;
  int64 at = 2;
}

enum Screen {
  SCREEN_UNSPECIFIED = 0;
  SCREEN_HOME = 1;
  SCREEN_LOCK = 2;
  SCREEN_BOTH = 3;
}
